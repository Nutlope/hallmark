name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: References, gates, fixtures, versions and links agree
        run: node skills/ms-web-design/scripts/refcheck.mjs
      - name: Every theme validates
        run: node skills/ms-web-design/scripts/theme.mjs validate skills/ms-web-design/references/themes/*.md
      - name: The theme index is current
        run: |
          node skills/ms-web-design/scripts/theme.mjs index
          git diff --exit-code -- skills/ms-web-design/references/themes/index.json
